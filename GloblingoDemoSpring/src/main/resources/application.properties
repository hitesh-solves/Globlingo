spring.application.name=globlingo

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/globlingo
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Server Configuration
server.port=${PORT:8081}

# YouTube API Configuration
youtube.api.key=${YOUTUBE_API_KEY:}

# AI Tutor provider settings (key is backend-only).
# Grammar correction and contextual word explanations now use Google Gemini.
# The OpenAI settings are kept only so an existing run configuration keeps loading.
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}

# Google Gemini (AI Tutor grammar correction + contextual word explanations). Backend-only key.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}

# LibreTranslate (local/self-hosted machine translation). No key required by default.
libretranslate.base-url=${LIBRETRANSLATE_BASE_URL:http://localhost:5000}
libretranslate.api-key=${LIBRETRANSLATE_API_KEY:}

# Free Dictionary API (English dictionary used for the word popup definitions).
dictionary.api.base-url=${DICTIONARY_API_BASE_URL:https://api.dictionaryapi.dev/api/v2}

# Transcript provider for YouTube captions (Supadata). Backend-only key.
transcript.supadata.api-key=${SUPADATA_API_KEY:}
scrapecreators.api-key=${SCRAPECREATORS_API_KEY:}

# Optional SMTP delivery for public email verification (no OTP is returned by the API).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:${MAIL_SMTP_STARTTLS:true}}
app.email.from=${MAIL_FROM:}

# Set this to the exact comma-separated frontend origins in the deployment.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501,http://localhost:3000,http://127.0.0.1:3000}
app.security.session-cookie-secure=${SESSION_COOKIE_SECURE:false}
app.security.csrf-cookie-samesite=${CSRF_COOKIE_SAMESITE:Lax}

# Translation service configuration
translation.api.enabled=${TRANSLATION_API_ENABLED:true}

# CORS Configuration (will be configured in code for more control)


groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
searchapi.api-key=${SEARCHAPI_API_KEY:}

transcript.ytdlp.enabled=${YTDLP_ENABLED:true}
transcript.ytdlp.command=${YTDLP_COMMAND:python -m yt_dlp}
transcript.ytdlp.timeout-seconds=${YTDLP_TIMEOUT_SECONDS:120}
transcript.whisper.enabled=${WHISPER_ENABLED:true}
transcript.whisper.script=${WHISPER_SCRIPT:scripts/whisper_transcribe.py}
transcript.whisper.command=${WHISPER_COMMAND:python}
transcript.whisper.timeout-seconds=${WHISPER_TIMEOUT_SECONDS:600}
