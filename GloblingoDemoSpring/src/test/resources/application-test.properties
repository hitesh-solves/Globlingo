spring.datasource.url=jdbc:h2:mem:globlingo-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
server.port=0
youtube.api.key=
# AI features are asserted through their "unconfigured" path, so leave the key blank here.
gemini.api-key=
# Point the external lookup services at a closed port so tests stay fast and offline.
libretranslate.base-url=http://localhost:1
dictionary.api.base-url=http://localhost:1/api/v2
spring.mail.host=mail.test.invalid
app.email.from=no-reply@globlingo.test
# The /api/translate 503 test asserts the unconfigured path, so leave translation disabled here.
translation.api.enabled=false
